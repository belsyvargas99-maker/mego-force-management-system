# Verifica el codigo (lint, build, tests), construye la imagen Docker, la prueba
# y la publica en GitHub Container Registry (ghcr.io) cada vez que se sube codigo a main.
# El VPS de Hostinger descarga esa imagen desde el Docker Manager.
name: Construir imagen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLIC_HOST: mego-registro.systemagencygarciavargas.tech
  ADMIN_HOST: mego-admin.systemagencygarciavargas.tech

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Todavia no hay package-lock.json versionado: npm install genera uno.
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Lint (tsc)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      # Guarda el package-lock.json generado para poder versionarlo despues.
      - name: Guardar package-lock.json generado
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 30

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen (local, para probarla)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mego-force-app:test
          build-args: |
            VITE_PUBLIC_HOST=${{ env.PUBLIC_HOST }}
            VITE_ADMIN_HOST=${{ env.ADMIN_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prueba rapida del contenedor
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e PUBLIC_HOST=$PUBLIC_HOST -e ADMIN_HOST=$ADMIN_HOST -e APP_MODE=public \
            mego-force-app:test
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then echo "El contenedor no respondio a /api/health"; docker logs smoke; exit 1; fi

          health=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)
          admin_public=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $PUBLIC_HOST" http://127.0.0.1:3000/admin)
          home_public=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $PUBLIC_HOST" http://127.0.0.1:3000/)
          admin_admin=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $ADMIN_HOST" http://127.0.0.1:3000/admin)
          echo "/api/health -> $health"
          echo "/admin (host publico) -> $admin_public"
          echo "/ (host publico) -> $home_public"
          echo "/admin (host admin) -> $admin_admin"
          docker logs smoke
          docker rm -f smoke > /dev/null
          [ "$health" = "200" ] || { echo "Se esperaba 200 en /api/health"; exit 1; }
          [ "$admin_public" = "404" ] || { echo "Se esperaba 404 en /admin con el host publico"; exit 1; }
          [ "$home_public" = "200" ] || { echo "Se esperaba 200 en / con el host publico"; exit 1; }
          [ "$admin_admin" = "200" ] || { echo "Se esperaba 200 en /admin con el host admin"; exit 1; }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reutiliza la cache de la construccion anterior: no recompila.
      - name: Publicar imagen en ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_PUBLIC_HOST=${{ env.PUBLIC_HOST }}
            VITE_ADMIN_HOST=${{ env.ADMIN_HOST }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=MEGO FORCE Management System
          cache-from: type=gha
